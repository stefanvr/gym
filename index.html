<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Climb Log</title>
<meta name="description" content="A personal map of climbing and bouldering gyms across the Netherlands, Belgium, and German Limburg." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar__header">
      <h1>Climb Log</h1>
      <p class="subtitle">Every wall I've chalked up on, one pin at a time.</p>
    </div>

    <div class="stats" id="stats"></div>

    <div class="filters" id="filters"></div>
    <ul class="gym-list-header">Gyms</ul>
    <ul class="gym-list" id="gym-list"></ul>
  </aside>

  <main id="map" role="application" aria-label="Map of climbing gyms"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="js/map.js"></script>
</body>
</html>
