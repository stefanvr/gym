name: Harness CI

on:
  pull_request:
    paths:
      - ".harness/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/workflows/harness-ci.yml"
  push:
    paths:
      - ".harness/**"
      - ".claude/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/workflows/harness-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile runtime and evaluator
        run: python -m compileall -q .harness/runtime .harness/evals/behavior/run.py
      - name: Structural Harness check
        run: python .harness/runtime/harness.py check
      - name: Runtime regression suite
        run: python -m unittest discover -s .harness/runtime/tests -v
      - name: Behavioral evaluator regression suite
        run: python -m unittest discover -s .harness/evals/behavior/tests -v
      - name: Validate LLM behavior corpus
        run: python .harness/evals/behavior/run.py --validate-only

  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - name: Require all runtime matrix checks
        run: test "${{ needs.runtime.result }}" = "success"
