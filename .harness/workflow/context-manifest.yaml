version: 1
# Startup context is deliberately small. Load everything else by active composition
# and current concern through the inventories below.
always:
- .harness/workflow/WORKFLOW.md
- .harness/composition/active.json
- .harness/workflow/routing.md
always_state:
  repository_git: inspect
  goal_for_current_branch: derive doc/goals/<branch>.md
  dreams_if_present: doc/dreams/
# Selection rule: the active Project model, Collaboration model, and method packs are
# resolved only from active.json `selection` + `sources`. The model and method entries
# below are an inventory of loadable definitions, not a selection; load only the ones
# active.json selects.
composition:
  definition: .harness/composition/definition.md
  active: .harness/composition/active.json
  classification: .harness/composition/classification.json
  project_models:
    spec: .harness/project-models/spec.md
  project_model_bindings:
    spec_topology: .harness/project-models/spec-topology.md
  collaboration_models:
    single-user: .harness/collaboration-models/single-user.md
    cooperative-multi-user: .harness/collaboration-models/cooperative-multi-user.md
  roadmap: .harness/roadmap/v17.md
  release_note: .harness/releases/17.md

methods:
  interview_me: .harness/methods/interview-me.md
  event_storming: .harness/methods/event-storming.md
  story_mapping: .harness/methods/story-mapping.md
  design: .harness/methods/design.md
